<svg viewBox="0 0 640 220" role="img" aria-labelledby="t-fig-lead d-fig-lead" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <title id="t-fig-lead">Per-episode detection lead</title>
  <desc id="d-fig-lead">Distribution of lead in minutes across 48 held-out hot episodes. Against the first raw repricing the median lead is -2.0 minutes.</desc>
  <style>svg{--ink:#0D0B14;--ink2:#4A4759;--muted:#7B7890;--line:#E4E2EE;--c1:#4F46E5;--c2:#E8590C;--c3:#0E9384;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#F5F4FA;--ink2:#BFBCD0;--muted:#8A87A0;--line:#26233A;--c1:#8079F0;--c2:#DD5F24;--c3:#0F8B73}}.lbl{font:11px var(--mono,monospace);fill:var(--ink2,#4A4759)}.lbl-i{font:11px var(--mono,monospace);fill:var(--ink,#0D0B14)}.ttl{font:12px var(--sans,sans-serif);fill:var(--ink,#111)}.axis{stroke:var(--line,#E4E2EE);stroke-width:1}.rule{stroke:var(--muted,#7B7890);stroke-width:1;stroke-dasharray:3 3}.bar{fill:var(--c1,#4F46E5)}.bar-2{fill:var(--c3,#0E9384)}.ser{fill:none;stroke:var(--c1,#4F46E5);stroke-width:2}.ser-2{fill:none;stroke:var(--c2,#E8590C);stroke-width:1.5;stroke-dasharray:5 3}.dot{fill:var(--c1,#4F46E5)}.dot-2{fill:var(--ink2,#4A4759)}.cell{fill:var(--c1,#4F46E5)}.cv{font:9.5px var(--mono,monospace);fill:var(--ink,#111)}.cv.hi{fill:#fff}</style>
  <rect x="53" y="163.6" width="31.65" height="16.44" class="bar"><title>lead -11 min: 1 episode(s)</title></rect>
  <text x="68.8" y="195" class="lbl" text-anchor="middle">-11</text>
  <rect x="86.6" y="163.6" width="31.65" height="16.44" class="bar"><title>lead -10 min: 1 episode(s)</title></rect>
  <rect x="120.3" y="163.6" width="31.65" height="16.44" class="bar"><title>lead -9 min: 1 episode(s)</title></rect>
  <rect x="153.9" y="163.6" width="31.65" height="16.44" class="bar"><title>lead -7 min: 1 episode(s)</title></rect>
  <text x="169.8" y="195" class="lbl" text-anchor="middle">-7</text>
  <rect x="187.6" y="163.6" width="31.65" height="16.44" class="bar"><title>lead -5 min: 1 episode(s)</title></rect>
  <rect x="221.2" y="163.6" width="31.65" height="16.44" class="bar"><title>lead -3 min: 1 episode(s)</title></rect>
  <rect x="254.9" y="163.6" width="31.65" height="16.44" class="bar"><title>lead -2 min: 1 episode(s)</title></rect>
  <text x="270.7" y="195" class="lbl" text-anchor="middle">-2</text>
