  <rect x="490.4" y="163.6" width="31.65" height="16.44" class="bar"><title>lead 8 min: 1 episode(s)</title></rect>
  <rect x="524.1" y="114.2" width="31.65" height="65.78" class="bar"><title>lead 9 min: 4 episode(s)</title></rect>
