<svg viewBox="0 0 640 460" role="img" aria-labelledby="t-fig-agent-changes d-fig-agent-changes" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <title id="t-fig-agent-changes">Every change the search made, sorted by effect</title>
  <desc id="d-fig-agent-changes">Of 14 changes, 8 have an interval that crosses zero and bought nothing that can be told apart from noise. Three are real gains and three are real losses.</desc>
  <style>.lbl{font:12px var(--mono,monospace);fill:var(--ink-2)}.lbl-i{font:12px var(--mono,monospace);fill:var(--ink,#0D0B14)}.ttl{font:13px var(--sans,sans-serif);fill:var(--ink,#111)}.axis{stroke:var(--line,#E4E2EE);stroke-width:1}.rule{stroke:var(--muted,#7B7890);stroke-width:1;stroke-dasharray:3 3}.bar{fill:var(--c1,#4F46E5)}.bar-2{fill:var(--c3,#0E9384)}.ser{fill:none;stroke:var(--c1,#4F46E5);stroke-width:2}.ser-2{fill:none;stroke:var(--c2,#E8590C);stroke-width:1.5;stroke-dasharray:5 3}.dot{fill:var(--c1,#4F46E5)}.dot-2{fill:var(--ink-2)}.cell{fill:var(--c1,#4F46E5)}.cv{font:12px var(--mono,monospace);fill:var(--ink,#111)}.cv.hi{fill:#fff}</style>
  <defs><pattern id="hz-fig-agent-changes" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--muted)" stroke-width="2"/></pattern></defs>
  <line x1="322.6" y1="28" x2="322.6" y2="386" class="rule"/>
  <text x="322.6" y="22" class="lbl" text-anchor="middle">no change</text>
  <text x="0" y="52" class="lbl-i" text-anchor="start">model family: linear → tree</text>
  <rect x="322.6" y="41" width="188.17" height="14" fill="var(--c3)"><title>model family: linear → boosted tree: +0.1039 — a real gain</title></rect>
  <text x="624" y="52" class="lbl-i" text-anchor="end">▲ +0.1039</text>
  <text x="0" y="77" class="lbl-i" text-anchor="start">learning rate 0.1 → 0.05</text>
  <rect x="322.6" y="66" width="37.13" height="14" fill="var(--c3)"><title>learning rate 0.1 → 0.05: +0.0205 — a real gain</title></rect>
  <text x="624" y="77" class="lbl-i" text-anchor="end">▲ +0.0205</text>
  <text x="0" y="102" class="lbl-i" text-anchor="start">merchant id → its own fraud rate</text>
  <rect x="322.6" y="91" width="33.87" height="14" fill="var(--c3)"><title>merchant id → its own fraud rate: +0.0187 — a real gain</title></rect>
  <text x="624" y="102" class="lbl-i" text-anchor="end">▲ +0.0187</text>
  <text x="0" y="127" class="lbl-i" text-anchor="start">learning rate 0.05 → 0.025</text>
  <rect x="322.6" y="116" width="6.7" height="14" fill="url(#hz-fig-agent-changes)" stroke="var(--muted)" stroke-width="1"><title>learning rate 0.05 → 0.025: +0.0037 — interval crosses zero</title></rect>
  <text x="624" y="127" class="lbl-i" text-anchor="end">≈ +0.0037</text>
  <text x="0" y="152" class="lbl-i" text-anchor="start">5 derived ratios added</text>
  <rect x="322.6" y="141" width="3.98" height="14" fill="url(#hz-fig-agent-changes)" stroke="var(--muted)" stroke-width="1"><title>5 derived ratios added: +0.0022 — interval crosses zero</title></rect>
  <text x="624" y="152" class="lbl-i" text-anchor="end">≈ +0.0022</text>
  <text x="0" y="177" class="lbl-i" text-anchor="start">column subsampling to 60%</text>
  <rect x="322.6" y="166" width="1.45" height="14" fill="url(#hz-fig-agent-changes)" stroke="var(--muted)" stroke-width="1"><title>column subsampling to 60%: +0.0008 — interval crosses zero</title></rect>
  <text x="624" y="177" class="lbl-i" text-anchor="end">≈ +0.0008</text>
