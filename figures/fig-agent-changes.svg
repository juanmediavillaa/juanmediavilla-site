  <text x="624" y="202" class="lbl-i" text-anchor="end">≈ +0.0007</text>
  <text x="0" y="227" class="lbl-i" text-anchor="start">leaves per tree 31 → 63</text>
  <rect x="322" y="216" width="0.54" height="14" fill="url(#hz-fig-agent-changes)" stroke="var(--muted)" stroke-width="1"><title>leaves per tree 31 → 63: -0.0003 — interval crosses zero</title></rect>
  <text x="624" y="227" class="lbl-i" text-anchor="end">≈ -0.0003</text>
  <text x="0" y="252" class="lbl-i" text-anchor="start">leaf-value shrinkage 0 → 10</text>
  <rect x="321.1" y="241" width="1.45" height="14" fill="url(#hz-fig-agent-changes)" stroke="var(--muted)" stroke-width="1"><title>leaf-value shrinkage 0 → 10: -0.0008 — interval crosses zero</title></rect>
  <text x="624" y="252" class="lbl-i" text-anchor="end">≈ -0.0008</text>
  <text x="0" y="277" class="lbl-i" text-anchor="start">leaves per tree 31 → 15</text>
  <rect x="320.7" y="266" width="1.81" height="14" fill="url(#hz-fig-agent-changes)" stroke="var(--muted)" stroke-width="1"><title>leaves per tree 31 → 15: -0.001 — interval crosses zero</title></rect>
  <text x="624" y="277" class="lbl-i" text-anchor="end">≈ -0.001</text>
  <text x="0" y="302" class="lbl-i" text-anchor="start">encoding fold seed 0 → 7</text>
  <rect x="319.3" y="291" width="3.26" height="14" fill="url(#hz-fig-agent-changes)" stroke="var(--muted)" stroke-width="1"><title>encoding fold seed 0 → 7: -0.0018 — interval crosses zero</title></rect>
  <text x="624" y="302" class="lbl-i" text-anchor="end">≈ -0.0018</text>
  <text x="0" y="327" class="lbl-i" text-anchor="start">feature set 27 → 15 columns</text>
  <rect x="312.4" y="316" width="10.14" height="14" fill="var(--c2)"><title>feature set 27 → 15 columns: -0.0056 — a real loss</title></rect>
  <text x="624" y="327" class="lbl-i" text-anchor="end">▼ -0.0056</text>
  <text x="0" y="352" class="lbl-i" text-anchor="start">class re-weighting on</text>
  <rect x="309.3" y="341" width="13.22" height="14" fill="var(--c2)"><title>class re-weighting on: -0.0073 — a real loss</title></rect>
  <text x="624" y="352" class="lbl-i" text-anchor="end">▼ -0.0073</text>
  <text x="0" y="377" class="lbl-i" text-anchor="start">boosting rounds 100 → 400</text>
  <rect x="261" y="366" width="61.58" height="14" fill="var(--c2)"><title>boosting rounds 100 → 400: -0.034 — a real loss</title></rect>
  <text x="624" y="377" class="lbl-i" text-anchor="end">▼ -0.034</text>
