<svg viewBox="0 0 640 212" role="img" aria-labelledby="t-fig-strategies d-fig-strategies" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <title id="t-fig-strategies">Four strategies against a random baseline</title>
  <desc id="d-fig-strategies">Three strategies score no edge with p-values far above 0.05. The fourth is not plotted: it abstained on every market because the data lacks the signal it needs.</desc>
  <style>.lbl{font:12px var(--mono,monospace);fill:var(--ink-2)}.lbl-i{font:12px var(--mono,monospace);fill:var(--ink,#0D0B14)}.ttl{font:13px var(--sans,sans-serif);fill:var(--ink,#111)}.axis{stroke:var(--line,#E4E2EE);stroke-width:1}.rule{stroke:var(--muted,#7B7890);stroke-width:1;stroke-dasharray:3 3}.bar{fill:var(--c1,#4F46E5)}.bar-2{fill:var(--c3,#0E9384)}.ser{fill:none;stroke:var(--c1,#4F46E5);stroke-width:2}.ser-2{fill:none;stroke:var(--c2,#E8590C);stroke-width:1.5;stroke-dasharray:5 3}.dot{fill:var(--c1,#4F46E5)}.dot-2{fill:var(--ink-2)}.cell{fill:var(--c1,#4F46E5)}.cv{font:12px var(--mono,monospace);fill:var(--ink,#111)}.cv.hi{fill:#fff}</style>
  <line x1="186" y1="22" x2="186" y2="186" class="rule"/>
  <text x="186" y="16" class="lbl" text-anchor="middle">p = 0.05</text>
  <text x="0" y="48" class="lbl-i" text-anchor="start">mean_reversion_v1</text>
  <rect x="168" y="35" width="179.21" height="18" class="bar"><title>mean_reversion_v1: p = 0.498 vs random, 67 trades</title></rect>
  <text x="355.2" y="48" class="lbl-i" text-anchor="start">p = 0.498</text>
  <text x="624" y="48" class="lbl" text-anchor="end">NO_EDGE</text>
  <text x="0" y="88" class="lbl-i" text-anchor="start">longshot_fade_v1</text>
  <rect x="168" y="75" width="216.25" height="18" class="bar"><title>longshot_fade_v1: p = 0.601 vs random, 157 trades</title></rect>
  <text x="392.3" y="88" class="lbl-i" text-anchor="start">p = 0.601</text>
  <text x="624" y="88" class="lbl" text-anchor="end">NO_EDGE</text>
  <text x="0" y="128" class="lbl-i" text-anchor="start">depth_imbalance_v1</text>
  <line x1="168" y1="124" x2="528" y2="124" class="axis"/>
  <text x="172" y="118" class="lbl-i" text-anchor="start">no bar — abstained on every market</text>
  <text x="624" y="128" class="lbl-i" text-anchor="end">NOT_APPLICABLE</text>
  <text x="0" y="168" class="lbl-i" text-anchor="start">regime_conditioned_v1</text>
  <rect x="168" y="155" width="220.57" height="18" class="bar"><title>regime_conditioned_v1: p = 0.613 vs random, 4 trades</title></rect>
  <text x="396.6" y="168" class="lbl-i" text-anchor="start">p = 0.613</text>
  <text x="624" y="168" class="lbl" text-anchor="end">NO_EDGE</text>
  <line x1="168" y1="182" x2="528" y2="182" class="axis"/>
  <text x="168" y="194" class="lbl" text-anchor="middle">0</text>
  <text x="258" y="194" class="lbl" text-anchor="middle">0.25</text>
  <text x="348" y="194" class="lbl" text-anchor="middle">0.5</text>
  <text x="438" y="194" class="lbl" text-anchor="middle">0.75</text>
  <text x="348" y="207" class="lbl" text-anchor="middle">how easily chance alone explains it (longer = more likely chance)</text>
</svg>
