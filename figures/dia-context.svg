<svg viewBox="0 0 660 240" role="img" aria-labelledby="dt-dia-context dd-dia-context" xmlns="http://www.w3.org/2000/svg">
  <title id="dt-dia-context">Context budget over a session</title>
  <desc id="dd-dia-context">Conceptual, not measured. An orchestrator that reads everything itself fills its context and degrades; one that delegates reading and receives summaries stays sharp for far longer.</desc>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs>
  <style>svg{--ink:#0D0B14;--ink2:#4A4759;--muted:#7B7890;--line:#E4E2EE;--surface:#FBFAFC;--c1:#4F46E5;--c2:#E8590C;--c3:#0E9384;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#F5F4FA;--ink2:#BFBCD0;--muted:#8A87A0;--line:#26233A;--surface:#12101C;--c1:#8079F0;--c2:#DD5F24;--c3:#0F8B73}}.bx{fill:var(--surface);stroke:var(--line);stroke-width:1}.bx1{stroke:var(--c1);stroke-width:1.5}.bx2{stroke:var(--c2);stroke-width:1.5}.bx3{stroke:var(--c3);stroke-width:1.5}.t{font:13px var(--sans);fill:var(--ink)}.ts{font:12px var(--mono);fill:var(--ink2)}.tm{font:12px var(--mono);fill:var(--ink2)}.ar{stroke:var(--muted);stroke-width:1.2;fill:none;marker-end:url(#a)}.ar1{stroke:var(--c1)}.ar2{stroke:var(--c2)}.dash{stroke-dasharray:4 3}.pulse{opacity:0}</style>
  <line x1="56" y1="180" x2="620" y2="180" class="ar"/>
  <line x1="56" y1="180" x2="56" y2="30" class="ar"/>
  <path d="M56 180 Q260 50 620 36" fill="none" stroke="var(--c2)" stroke-width="2"/>
  <path d="M56 180 Q320 154 620 126" fill="none" stroke="var(--c1)" stroke-width="2"/>
  <text x="614" y="32" class="ts" text-anchor="end">reads everything itself</text>
  <text x="614" y="120" class="ts" text-anchor="end">delegates reading</text>
  <text x="50" y="36" class="ts" text-anchor="end">full</text>
  <text x="50" y="180" class="ts" text-anchor="end">empty</text>
  <text x="338.0" y="200" class="ts" text-anchor="middle">session length →</text>
  <text x="8" y="214" class="t" text-anchor="start">CONCEPTUAL — the shape of the problem, not measured data</text>
  <text x="8" y="230" class="tm" text-anchor="start">the failure mode is gradual and invisible, so it is designed against up front</text>
</svg>
