  <line x1="52.0" y1="160.6" x2="624.0" y2="160.6" class="axis"/>
  <text x="46.0" y="164.1" class="lbl" text-anchor="end">0.2</text>
  <line x1="52.0" y1="111.1" x2="624.0" y2="111.1" class="axis"/>
  <text x="46.0" y="114.6" class="lbl" text-anchor="end">0.5</text>
  <line x1="52.0" y1="61.7" x2="624.0" y2="61.7" class="axis"/>
  <text x="46.0" y="65.2" class="lbl" text-anchor="end">0.8</text>
  <line x1="52.0" y1="210.0" x2="624.0" y2="210.0" class="axis"/>
  <text x="52.0" y="225.0" class="lbl" text-anchor="middle">3</text>
  <text x="147.3" y="225.0" class="lbl" text-anchor="middle">10</text>
  <text x="283.5" y="225.0" class="lbl" text-anchor="middle">20</text>
  <text x="419.7" y="225.0" class="lbl" text-anchor="middle">30</text>
  <text x="555.9" y="225.0" class="lbl" text-anchor="middle">40</text>
  <text x="338.0" y="242.0" class="lbl" text-anchor="middle">minutes the burst has already lasted</text>
  <text x="12.0" y="121.0" class="lbl" text-anchor="middle" transform="rotate(-90 12 121)">chance it ends this minute</text>
