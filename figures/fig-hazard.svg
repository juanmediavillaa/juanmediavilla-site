<svg viewBox="0 0 640 250" role="img" aria-labelledby="t-fig-hazard d-fig-hazard" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <title id="t-fig-hazard">Hot-episode hazard against elapsed time</title>
  <desc id="d-fig-hazard">The truncation-robust discrete hazard falls from 0.325 to 0.167 per minute over 3 to 40 minutes elapsed. The rejected Weibull fit rises instead.</desc>
  <style>svg{--ink:#0D0B14;--ink2:#4A4759;--muted:#7B7890;--line:#E4E2EE;--c1:#4F46E5;--c2:#E8590C;--c3:#0E9384;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#F5F4FA;--ink2:#BFBCD0;--muted:#8A87A0;--line:#26233A;--c1:#8079F0;--c2:#DD5F24;--c3:#0F8B73}}.lbl{font:11px var(--mono,monospace);fill:var(--ink2,#4A4759)}.lbl-i{font:11px var(--mono,monospace);fill:var(--ink,#0D0B14)}.ttl{font:12px var(--sans,sans-serif);fill:var(--ink,#111)}.axis{stroke:var(--line,#E4E2EE);stroke-width:1}.rule{stroke:var(--muted,#7B7890);stroke-width:1;stroke-dasharray:3 3}.bar{fill:var(--c1,#4F46E5)}.bar-2{fill:var(--c3,#0E9384)}.ser{fill:none;stroke:var(--c1,#4F46E5);stroke-width:2}.ser-2{fill:none;stroke:var(--c2,#E8590C);stroke-width:1.5;stroke-dasharray:5 3}.dot{fill:var(--c1,#4F46E5)}.dot-2{fill:var(--ink2,#4A4759)}.cell{fill:var(--c1,#4F46E5)}.cv{font:9.5px var(--mono,monospace);fill:var(--ink,#111)}.cv.hi{fill:#fff}</style>
  <line x1="52" y1="210" x2="624" y2="210" class="axis"/>
  <text x="46" y="213.5" class="lbl" text-anchor="end">0</text>
  <line x1="52" y1="160.6" x2="624" y2="160.6" class="axis"/>
  <text x="46" y="164.1" class="lbl" text-anchor="end">0.2</text>
  <line x1="52" y1="111.1" x2="624" y2="111.1" class="axis"/>
  <text x="46" y="114.6" class="lbl" text-anchor="end">0.5</text>
  <line x1="52" y1="61.7" x2="624" y2="61.7" class="axis"/>
  <text x="46" y="65.2" class="lbl" text-anchor="end">0.8</text>
  <line x1="52" y1="210" x2="624" y2="210" class="axis"/>
  <text x="52" y="225" class="lbl" text-anchor="middle">3</text>
  <text x="147.3" y="225" class="lbl" text-anchor="middle">10</text>
  <text x="283.5" y="225" class="lbl" text-anchor="middle">20</text>
  <text x="419.7" y="225" class="lbl" text-anchor="middle">30</text>
  <text x="555.9" y="225" class="lbl" text-anchor="middle">40</text>
  <text x="338" y="242" class="lbl" text-anchor="middle">minutes the burst has already lasted</text>
  <text x="12" y="121" class="lbl" text-anchor="middle" transform="rotate(-90 12 121)">chance it ends this minute</text>
  <path d="M72.4 145.8 L120.1 127.6 L181.4 109.9 L283.5 87.3 L453.8 58.5 L590 39.8" class="ser-2"/>
  <path d="M72.4 145.8 L120.1 162.7 L181.4 171.7 L283.5 189.7 L453.8 188.6 L590 177" class="ser"/>
  <circle cx="72.4" cy="145.8" r="3.5" class="dot"><title>0.3247/min, 113 episodes ended</title></circle>
  <circle cx="120.1" cy="162.7" r="3.5" class="dot"><title>0.2394/min, 45 episodes ended</title></circle>
  <circle cx="181.4" cy="171.7" r="3.5" class="dot"><title>0.1939/min, 19 episodes ended</title></circle>
  <circle cx="283.5" cy="189.7" r="3.5" class="dot"><title>0.1026/min, 8 episodes ended</title></circle>
  <circle cx="453.8" cy="188.6" r="3.5" class="dot"><title>0.1081/min, 4 episodes ended</title></circle>
  <circle cx="590" cy="177" r="3.5" class="dot"><title>0.1667/min, 1 episodes ended</title></circle>
  <circle cx="72.4" cy="145.8" r="2.5" class="dot-2"/>
  <circle cx="120.1" cy="127.6" r="2.5" class="dot-2"/>
  <circle cx="181.4" cy="109.9" r="2.5" class="dot-2"/>
  <circle cx="283.5" cy="87.3" r="2.5" class="dot-2"/>
  <circle cx="453.8" cy="58.5" r="2.5" class="dot-2"/>
  <circle cx="590" cy="39.8" r="2.5" class="dot-2"/>
  <text x="128.1" y="152.7" class="lbl-i" text-anchor="start">observed — falls</text>
  <text x="453.8" y="46.5" class="lbl" text-anchor="end">rejected Weibull (k=1.43) — rises</text>
</svg>
