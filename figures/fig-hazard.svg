  <circle cx="181.4" cy="171.7" r="3.5" class="dot"><title>0.1939/min, 19 episodes ended</title></circle>
  <circle cx="283.5" cy="189.7" r="3.5" class="dot"><title>0.1026/min, 8 episodes ended</title></circle>
