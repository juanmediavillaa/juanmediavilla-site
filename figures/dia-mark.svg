<svg viewBox="0 0 660 230" role="img" aria-labelledby="dt-dia-mark dd-dia-mark" xmlns="http://www.w3.org/2000/svg">
  <title id="dt-dia-mark">Marking the book, and the refusal</title>
  <desc id="dd-dia-mark">Recomputing what the fund is worth means pricing every holding against the market. If any one of them has no quote, the write is refused and the last value the book could stand behind is left in place.</desc>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs>
  <style>.bx{fill:var(--surface);stroke:var(--line);stroke-width:1}.bx1{stroke:var(--c1);stroke-width:1.5}.bx2{stroke:var(--c2);stroke-width:1.5}.bx3{stroke:var(--c3);stroke-width:1.5}.t{font:13px var(--sans);fill:var(--ink)}.ts{font:12px var(--mono);fill:var(--ink-2)}.tm{font:12px var(--mono);fill:var(--ink-2)}.ar{stroke:var(--muted);stroke-width:1.2;fill:none;marker-end:url(#a)}.ar1{stroke:var(--c1)}.ar2{stroke:var(--c2)}.dash{stroke-dasharray:4 3}.pulse{opacity:0}</style>
  <g><rect x="8" y="26" width="168" height="50" rx="6" class="bx bx3"/><title>the only moment a new fund value is recorded</title><text x="92" y="46" class="t" text-anchor="middle" dominant-baseline="middle">mark to market</text><text x="92" y="62" class="ts" text-anchor="middle" dominant-baseline="middle">operator asks for it</text></g>
  <g><rect x="212" y="26" width="196" height="50" rx="6" class="bx bx1"/><title>each position is priced against live market data</title><text x="310" y="46" class="t" text-anchor="middle" dominant-baseline="middle">quote every holding</text><text x="310" y="62" class="ts" text-anchor="middle" dominant-baseline="middle">live market data</text></g>
  <g><rect x="452" y="26" width="200" height="50" rx="6" class="bx bx2"/><title>the gate: a partial answer is not an answer</title><text x="552" y="51" class="t" text-anchor="middle" dominant-baseline="middle">every one priced?</text></g>
  <path d="M176 51 L210 51" class="ar ar1"/>
  <path d="M408 51 L450 51" class="ar ar1"/>
  <path d="M552 78 L512 128" class="ar ar1"/>
  <path d="M540 78 L148 128" class="ar ar2"/>
  <text x="566" y="106" class="ts" text-anchor="start">yes</text>
  <text x="300" y="96" class="ts" text-anchor="start">no</text>
  <g><rect x="372" y="132" width="280" height="48" rx="6" class="bx bx1"/><title>the invariant the book is kept to</title><text x="512" y="151" class="t" text-anchor="middle" dominant-baseline="middle">fund value written</text><text x="512" y="167" class="ts" text-anchor="middle" dominant-baseline="middle">cash + Σ (position market value)</text></g>
  <g><rect x="8" y="132" width="280" height="48" rx="6" class="bx bx2"/><title>a missing quote produces a refusal, never a filled-in number</title><text x="148" y="151" class="t" text-anchor="middle" dominant-baseline="middle">write refused</text><text x="148" y="167" class="ts" text-anchor="middle" dominant-baseline="middle">no value recorded, none guessed</text></g>
  <text x="8" y="200" class="tm" text-anchor="start">positions are derived from an append-only trade ledger, not stored</text>
  <text x="8" y="218" class="tm" text-anchor="start">each trade stamps the FX rate of its own trade date, so it cannot drift</text>
</svg>
