<svg viewBox="0 0 660 230" role="img" aria-labelledby="dt-dia-two-state dd-dia-two-state" xmlns="http://www.w3.org/2000/svg">
  <title id="dt-dia-two-state">The two-state market</title>
  <desc id="dd-dia-two-state">A market switches between a quiet state, moving its price about once every 25 minutes, and a busy state, moving about once every 53 seconds. The state itself is hidden and has to be inferred from the price moves.</desc>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs>
  <style>svg{--ink:#0D0B14;--ink2:#4A4759;--muted:#7B7890;--line:#E4E2EE;--surface:#FBFAFC;--c1:#4F46E5;--c2:#E8590C;--c3:#0E9384;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#F5F4FA;--ink2:#BFBCD0;--muted:#8A87A0;--line:#26233A;--surface:#12101C;--c1:#8079F0;--c2:#DD5F24;--c3:#0F8B73}}.bx{fill:var(--surface);stroke:var(--line);stroke-width:1}.bx1{stroke:var(--c1);stroke-width:1.5}.bx2{stroke:var(--c2);stroke-width:1.5}.bx3{stroke:var(--c3);stroke-width:1.5}.t{font:13px var(--sans);fill:var(--ink)}.ts{font:12px var(--mono);fill:var(--ink2)}.tm{font:12px var(--mono);fill:var(--ink2)}.ar{stroke:var(--muted);stroke-width:1.2;fill:none;marker-end:url(#a)}.ar1{stroke:var(--c1)}.ar2{stroke:var(--c2)}.dash{stroke-dasharray:4 3}.pulse{opacity:0}</style>
  <g><rect x="60" y="30" width="200" height="66" rx="6" class="bx bx3"/><title>lambda_cold 0.041 moves per minute; dwell about 37 minutes</title><text x="160" y="58" class="t" text-anchor="middle" dominant-baseline="middle">QUIET state</text><text x="160" y="74" class="ts" text-anchor="middle" dominant-baseline="middle">one move ≈ every 25 min</text></g>
  <g><rect x="400" y="30" width="200" height="66" rx="6" class="bx bx2"/><title>lambda_hot 1.141 moves per minute; dwell about 8 minutes</title><text x="500" y="58" class="t" text-anchor="middle" dominant-baseline="middle">BUSY state</text><text x="500" y="74" class="ts" text-anchor="middle" dominant-baseline="middle">one move ≈ every 53 s</text></g>
  <path d="M262 50 Q330 18 398 50" class="ar"/>
  <path d="M398 82 Q330 114 262 82" class="ar"/>
  <text x="330" y="14" class="ts" text-anchor="middle">switches</text>
  <text x="330" y="132" class="ts" text-anchor="middle">switches back</text>
  <text x="160" y="112" class="ts" text-anchor="middle">stays ~37 min</text>
  <text x="500" y="112" class="ts" text-anchor="middle">stays ~8 min</text>
  <text x="330" y="160" class="t" text-anchor="middle">28× faster in the busy state</text>
  <rect x="60" y="180" width="540" height="34" rx="6" class="bx dash"/>
  <text x="330" y="201" class="ts" text-anchor="middle">you never observe the state — only the moves it produces</text>
</svg>
