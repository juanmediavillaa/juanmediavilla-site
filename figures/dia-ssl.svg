<svg viewBox="0 0 660 230" role="img" aria-labelledby="dt-dia-ssl dd-dia-ssl" xmlns="http://www.w3.org/2000/svg">
  <title id="dt-dia-ssl">The self-supervised pipeline</title>
  <desc id="dd-dia-ssl">A model learns structure from a large pile of unlabelled sensor data, is then fine-tuned on the small labelled set, and is finally tested on people it has never seen.</desc>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs>
  <style>.bx{fill:var(--surface);stroke:var(--line);stroke-width:1}.bx1{stroke:var(--c1);stroke-width:1.5}.bx2{stroke:var(--c2);stroke-width:1.5}.bx3{stroke:var(--c3);stroke-width:1.5}.t{font:13px var(--sans);fill:var(--ink)}.ts{font:12px var(--mono);fill:var(--ink-2)}.tm{font:12px var(--mono);fill:var(--ink-2)}.ar{stroke:var(--muted);stroke-width:1.2;fill:none;marker-end:url(#a)}.ar1{stroke:var(--c1)}.ar2{stroke:var(--c2)}.dash{stroke-dasharray:4 3}.pulse{opacity:0}</style>
  <g><rect x="8" y="26" width="176" height="58" rx="6" class="bx bx3"/><title>learn the shape of the data without labels</title><text x="96" y="50" class="t" text-anchor="middle" dominant-baseline="middle">unlabelled sensor data</text><text x="96" y="66" class="ts" text-anchor="middle" dominant-baseline="middle">pretraining</text></g>
  <g><rect x="240" y="26" width="160" height="58" rx="6" class="bx bx1"/><title>labels are expensive; only a small set exists</title><text x="320" y="50" class="t" text-anchor="middle" dominant-baseline="middle">small labelled set</text><text x="320" y="66" class="ts" text-anchor="middle" dominant-baseline="middle">fine-tuning</text></g>
  <g><rect x="456" y="26" width="196" height="58" rx="6" class="bx bx2"/><title>tested on a person never seen in training — the only question that matters</title><text x="554" y="50" class="t" text-anchor="middle" dominant-baseline="middle">held-out person</text><text x="554" y="66" class="ts" text-anchor="middle" dominant-baseline="middle">leave-one-subject-out</text></g>
  <path d="M186 55 L238 55" class="ar ar1"/>
  <path d="M402 55 L454 55" class="ar ar2"/>
  <text x="8" y="116" class="tm" text-anchor="start">repeated for each of 22 people in turn, then pooled</text>
  <rect x="8" y="132" width="644" height="76" rx="6" class="bx dash"/>
  <text x="24" y="154" class="t" text-anchor="start">six architectures compared this way:</text>
  <text x="24" y="174" class="ts" text-anchor="start">SimCLR · DeepConvLSTM · SelfHARModel · SelfPAB · XGBoost · MOMENT</text>
  <text x="24" y="194" class="ts" text-anchor="start">spread 0.880 to 0.843 — a Friedman test says that ordering is noise</text>
</svg>
