<svg viewBox="0 0 640 252" role="img" aria-labelledby="t-fig-agent-near-miss d-fig-agent-near-miss" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <title id="t-fig-agent-near-miss">The correlations that carry the lookahead signature</title>
  <desc id="d-fig-agent-near-miss">The merchant score tracks each period's own fraud rate more closely than the two periods track each other. A score fixed before the data begins could not do that.</desc>
  <style>.lbl{font:12px var(--mono,monospace);fill:var(--ink-2)}.lbl-i{font:12px var(--mono,monospace);fill:var(--ink,#0D0B14)}.ttl{font:13px var(--sans,sans-serif);fill:var(--ink,#111)}.axis{stroke:var(--line,#E4E2EE);stroke-width:1}.rule{stroke:var(--muted,#7B7890);stroke-width:1;stroke-dasharray:3 3}.bar{fill:var(--c1,#4F46E5)}.bar-2{fill:var(--c3,#0E9384)}.ser{fill:none;stroke:var(--c1,#4F46E5);stroke-width:2}.ser-2{fill:none;stroke:var(--c2,#E8590C);stroke-width:1.5;stroke-dasharray:5 3}.dot{fill:var(--c1,#4F46E5)}.dot-2{fill:var(--ink-2)}.cell{fill:var(--c1,#4F46E5)}.cv{font:12px var(--mono,monospace);fill:var(--ink,#111)}.cv.hi{fill:#fff}</style>
  <defs><pattern id="hz-fig-agent-near-miss" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--muted)" stroke-width="2"/></pattern></defs>
  <line x1="407.9" y1="26" x2="407.9" y2="178" class="rule"/>
  <text x="0" y="48" class="lbl-i" text-anchor="start">score × 2024 rate</text>
  <text x="0" y="62" class="lbl" text-anchor="start">above the reference</text>
  <rect x="150" y="39" width="392.29" height="22" class="bar"><title>score vs its merchant's 2024 fraud rate: r = 0.943</title></rect>
  <text x="551.3" y="54" class="lbl-i" text-anchor="start">r = 0.943</text>
  <text x="0" y="94" class="lbl-i" text-anchor="start">score × 2025 rate</text>
  <text x="0" y="108" class="lbl" text-anchor="start">above the reference</text>
  <rect x="150" y="85" width="348.61" height="22" class="bar"><title>score vs its merchant's 2025 fraud rate: r = 0.838</title></rect>
  <text x="507.6" y="100" class="lbl-i" text-anchor="start">r = 0.838</text>
  <text x="0" y="140" class="lbl-i" text-anchor="start">2024 × 2025 rate</text>
  <text x="0" y="154" class="lbl" text-anchor="start">the reference</text>
  <rect x="150" y="131" width="257.92" height="22" fill="url(#hz-fig-agent-near-miss)" stroke="var(--muted)" stroke-width="1"><title>the 2024 rate vs the 2025 rate: r = 0.62 — the reference</title></rect>
  <text x="416.9" y="146" class="lbl-i" text-anchor="start">r = 0.62</text>
  <line x1="150" y1="184" x2="566" y2="184" class="axis"/>
  <text x="150" y="199" class="lbl" text-anchor="middle">0</text>
  <text x="254" y="199" class="lbl" text-anchor="middle">0.25</text>
  <text x="358" y="199" class="lbl" text-anchor="middle">0.5</text>
  <text x="462" y="199" class="lbl" text-anchor="middle">0.75</text>
  <text x="566" y="199" class="lbl" text-anchor="middle">1</text>
  <text x="358" y="212" class="lbl" text-anchor="middle">correlation, 0 to 1</text>
  <text x="0" y="244" class="lbl-i" text-anchor="start">dashed line: how well the two periods track each other</text>
</svg>
