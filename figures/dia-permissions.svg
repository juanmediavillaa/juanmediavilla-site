<svg viewBox="0 0 660 240" role="img" aria-labelledby="dt-dia-permissions dd-dia-permissions" xmlns="http://www.w3.org/2000/svg">
  <title id="dt-dia-permissions">Permissions and gates</title>
  <desc id="dd-dia-permissions">Each agent class gets the narrowest scope that lets it work. Anything irreversible or public stops at an explicit human gate.</desc>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs>
  <style>svg{--ink:#0D0B14;--ink2:#4A4759;--muted:#7B7890;--line:#E4E2EE;--surface:#FBFAFC;--c1:#4F46E5;--c2:#E8590C;--c3:#0E9384;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#F5F4FA;--ink2:#BFBCD0;--muted:#8A87A0;--line:#26233A;--surface:#12101C;--c1:#8079F0;--c2:#DD5F24;--c3:#0F8B73}}.bx{fill:var(--surface);stroke:var(--line);stroke-width:1}.bx1{stroke:var(--c1);stroke-width:1.5}.bx2{stroke:var(--c2);stroke-width:1.5}.bx3{stroke:var(--c3);stroke-width:1.5}.t{font:13px var(--sans);fill:var(--ink)}.ts{font:12px var(--mono);fill:var(--ink2)}.tm{font:12px var(--mono);fill:var(--ink2)}.ar{stroke:var(--muted);stroke-width:1.2;fill:none;marker-end:url(#a)}.ar1{stroke:var(--c1)}.ar2{stroke:var(--c2)}.dash{stroke-dasharray:4 3}.pulse{opacity:0}</style>
  <text x="250" y="26" class="ts" text-anchor="middle">read</text>
  <text x="330" y="26" class="ts" text-anchor="middle">write</text>
  <text x="410" y="26" class="ts" text-anchor="middle">git</text>
  <text x="500" y="26" class="ts" text-anchor="middle">publish</text>
  <g><rect x="8" y="44" width="210" height="26" rx="6" class="bx bx1"/><text x="113" y="57" class="t" text-anchor="middle" dominant-baseline="middle">explorer</text></g>
  <text x="250" y="61" class="t" text-anchor="middle">yes</text>
  <text x="330" y="61" class="ts" text-anchor="middle">no</text>
  <text x="410" y="61" class="ts" text-anchor="middle">no</text>
  <text x="500" y="61" class="ts" text-anchor="middle">no</text>
  <g><rect x="8" y="78" width="210" height="26" rx="6" class="bx bx1"/><text x="113" y="91" class="t" text-anchor="middle" dominant-baseline="middle">implementer</text></g>
  <text x="250" y="95" class="t" text-anchor="middle">yes</text>
  <text x="330" y="95" class="t" text-anchor="middle">yes</text>
  <text x="410" y="95" class="ts" text-anchor="middle">no</text>
  <text x="500" y="95" class="ts" text-anchor="middle">no</text>
  <g><rect x="8" y="112" width="210" height="26" rx="6" class="bx bx1"/><text x="113" y="125" class="t" text-anchor="middle" dominant-baseline="middle">reviewer</text></g>
  <text x="250" y="129" class="t" text-anchor="middle">yes</text>
  <text x="330" y="129" class="ts" text-anchor="middle">no</text>
  <text x="410" y="129" class="ts" text-anchor="middle">no</text>
  <text x="500" y="129" class="ts" text-anchor="middle">no</text>
  <g><rect x="8" y="146" width="210" height="26" rx="6" class="bx bx2"/><text x="113" y="159" class="t" text-anchor="middle" dominant-baseline="middle">me</text></g>
  <text x="250" y="163" class="t" text-anchor="middle">yes</text>
  <text x="330" y="163" class="t" text-anchor="middle">yes</text>
  <text x="410" y="163" class="t" text-anchor="middle">yes</text>
  <text x="500" y="163" class="t" text-anchor="middle">yes</text>
  <rect x="470" y="38" width="60" height="140" rx="6" class="bx bx2 dash"/>
  <text x="8" y="200" class="tm" text-anchor="start">push · deploy · delete · publish → always a human gate</text>
  <text x="8" y="218" class="tm" text-anchor="start">this site was built across five rounds on a branch never pushed unreviewed</text>
</svg>
