<svg viewBox="0 0 660 240" role="img" aria-labelledby="dt-dia-pipeline dd-dia-pipeline" xmlns="http://www.w3.org/2000/svg">
  <title id="dt-dia-pipeline">The collection pipeline</title>
  <desc id="dd-dia-pipeline">Six scheduled collectors write to storage on a 15 to 60 minute cadence. A gap audit checks continuity, and the audited output is a panel of 400 resolved markets and 188,856 trades.</desc>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs>
  <style>.bx{fill:var(--surface);stroke:var(--line);stroke-width:1}.bx1{stroke:var(--c1);stroke-width:1.5}.bx2{stroke:var(--c2);stroke-width:1.5}.bx3{stroke:var(--c3);stroke-width:1.5}.t{font:13px var(--sans);fill:var(--ink)}.ts{font:12px var(--mono);fill:var(--ink-2)}.tm{font:12px var(--mono);fill:var(--ink-2)}.ar{stroke:var(--muted);stroke-width:1.2;fill:none;marker-end:url(#a)}.ar1{stroke:var(--c1)}.ar2{stroke:var(--c2)}.dash{stroke-dasharray:4 3}.pulse{opacity:0}</style>
  <g><rect x="8" y="18" width="118" height="20" rx="6" class="bx bx1"/><title>scheduled collector 1, dispatched every 15–60 minutes</title><text x="67" y="28" class="t" text-anchor="middle" dominant-baseline="middle">collector 1</text></g>
  <g><rect x="8" y="42" width="118" height="20" rx="6" class="bx bx1"/><title>scheduled collector 2, dispatched every 15–60 minutes</title><text x="67" y="52" class="t" text-anchor="middle" dominant-baseline="middle">collector 2</text></g>
  <g><rect x="8" y="66" width="118" height="20" rx="6" class="bx bx1"/><title>scheduled collector 3, dispatched every 15–60 minutes</title><text x="67" y="76" class="t" text-anchor="middle" dominant-baseline="middle">collector 3</text></g>
  <g><rect x="8" y="90" width="118" height="20" rx="6" class="bx bx1"/><title>scheduled collector 4, dispatched every 15–60 minutes</title><text x="67" y="100" class="t" text-anchor="middle" dominant-baseline="middle">collector 4</text></g>
  <g><rect x="8" y="114" width="118" height="20" rx="6" class="bx bx1"/><title>scheduled collector 5, dispatched every 15–60 minutes</title><text x="67" y="124" class="t" text-anchor="middle" dominant-baseline="middle">collector 5</text></g>
  <g><rect x="8" y="138" width="118" height="20" rx="6" class="bx bx1"/><title>scheduled collector 6, dispatched every 15–60 minutes</title><text x="67" y="148" class="t" text-anchor="middle" dominant-baseline="middle">collector 6</text></g>
  <text x="8" y="172" class="ts" text-anchor="start">6 scheduled + 1 dormant</text>
  <g><rect x="160" y="60" width="116" height="56" rx="6" class="bx bx1"/><title>each collector runs on a systemd timer</title><text x="218" y="83" class="t" text-anchor="middle" dominant-baseline="middle">systemd timers</text><text x="218" y="99" class="ts" text-anchor="middle" dominant-baseline="middle">15–60 min</text></g>
  <g><rect x="302" y="60" width="126" height="56" rx="6" class="bx bx3"/><title>server working set; periodically offloaded to a ~1.05 TB archive</title><text x="365" y="83" class="t" text-anchor="middle" dominant-baseline="middle">storage</text><text x="365" y="99" class="ts" text-anchor="middle" dominant-baseline="middle">250 GB working set</text></g>
  <g><rect x="452" y="20" width="200" height="46" rx="6" class="bx bx2"/><title>every feed gap is logged and masked, never interpolated</title><text x="552" y="38" class="t" text-anchor="middle" dominant-baseline="middle">gap audit</text><text x="552" y="54" class="ts" text-anchor="middle" dominant-baseline="middle">continuity accounting</text></g>
  <g><rect x="452" y="96" width="200" height="56" rx="6" class="bx bx3"/><title>licence-clean and hash-verified; 382 used in the backtests</title><text x="552" y="119" class="t" text-anchor="middle" dominant-baseline="middle">audited panel</text><text x="552" y="135" class="ts" text-anchor="middle" dominant-baseline="middle">400 markets · 188,856 trades</text></g>
  <path d="M128 28 L158 88" class="ar ar1"/>
  <path d="M128 52 L158 88" class="ar ar1"/>
  <path d="M128 76 L158 88" class="ar ar1"/>
  <path d="M128 100 L158 88" class="ar ar1"/>
  <path d="M128 124 L158 88" class="ar ar1"/>
  <path d="M128 148 L158 88" class="ar ar1"/>
  <path d="M278 88 L308 88" class="ar "/>
  <path d="M422 80 L450 52" class="ar ar2"/>
  <path d="M422 96 L450 118" class="ar "/>
  <text x="8" y="196" class="tm" text-anchor="start">every gap logged and masked — never interpolated</text>
  <text x="8" y="212" class="tm" text-anchor="start">offloaded to a ~1.05 TB archive (self-reported, Aug 2026)</text>
</svg>
