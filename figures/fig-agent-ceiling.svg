<svg viewBox="0 0 640 284" role="img" aria-labelledby="t-fig-agent-ceiling d-fig-agent-ceiling" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <title id="t-fig-agent-ceiling">How far the search got, against the ceiling and against the trap</title>
  <desc id="d-fig-agent-ceiling">The honest search reached 0.3971 against an achievable ceiling of 0.4198. The same model with the excluded settlement column added back reaches 0.6194, which is not a candidate model and is drawn hatched.</desc>
  <style>.lbl{font:12px var(--mono,monospace);fill:var(--ink-2)}.lbl-i{font:12px var(--mono,monospace);fill:var(--ink,#0D0B14)}.ttl{font:13px var(--sans,sans-serif);fill:var(--ink,#111)}.axis{stroke:var(--line,#E4E2EE);stroke-width:1}.rule{stroke:var(--muted,#7B7890);stroke-width:1;stroke-dasharray:3 3}.bar{fill:var(--c1,#4F46E5)}.bar-2{fill:var(--c3,#0E9384)}.ser{fill:none;stroke:var(--c1,#4F46E5);stroke-width:2}.ser-2{fill:none;stroke:var(--c2,#E8590C);stroke-width:1.5;stroke-dasharray:5 3}.dot{fill:var(--c1,#4F46E5)}.dot-2{fill:var(--ink-2)}.cell{fill:var(--c1,#4F46E5)}.cv{font:12px var(--mono,monospace);fill:var(--ink,#111)}.cv.hi{fill:#fff}</style>
  <defs><pattern id="hz-fig-agent-ceiling" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--muted)" stroke-width="2"/></pattern></defs>
  <text x="0" y="44" class="lbl-i" text-anchor="start">random ranking</text>
  <text x="0" y="58" class="lbl" text-anchor="start">from the data itself</text>
  <rect x="152" y="36" width="12.42" height="20" class="bar"><title>a ranker guessing at random scores the fraud rate itself: 0.0206</title></rect>
  <text x="173.4" y="50" class="lbl-i" text-anchor="start">0.0206</text>
  <text x="0" y="84" class="lbl-i" text-anchor="start">library defaults</text>
  <text x="0" y="98" class="lbl" text-anchor="start">from the answer key</text>
  <rect x="152" y="76" width="163.16" height="20" class="bar"><title>out-of-the-box gradient boosting on the 27 admissible columns: 0.2706</title></rect>
  <text x="324.2" y="90" class="lbl-i" text-anchor="start">0.2706</text>
  <text x="0" y="124" class="lbl-i" text-anchor="start">this search</text>
  <text x="0" y="138" class="lbl" text-anchor="start">from the search</text>
  <rect x="152" y="116" width="239.43" height="20" class="bar"><title>the best admissible configuration the 25-run search found: 0.3971</title></rect>
  <text x="400.4" y="130" class="lbl-i" text-anchor="start">0.3971</text>
  <text x="0" y="164" class="lbl-i" text-anchor="start">achievable ceiling</text>
  <text x="0" y="178" class="lbl" text-anchor="start">from the answer key</text>
  <rect x="152" y="156" width="253.11" height="20" class="bar"><title>the best average precision attainable on the admissible columns: 0.4198</title></rect>
  <text x="414.1" y="170" class="lbl-i" text-anchor="start">0.4198</text>
  <text x="0" y="204" class="lbl-i" text-anchor="start">with the trap</text>
  <text x="0" y="218" class="lbl" text-anchor="start">from the search</text>
  <rect x="152" y="196" width="373.46" height="20" fill="url(#hz-fig-agent-ceiling)" stroke="var(--c2)" stroke-width="1.5"><title>the same model with the settlement column added back: 0.6194 — not a candidate model</title></rect>
  <text x="534.5" y="210" class="lbl-i" text-anchor="start">✕ 0.6194</text>
  <g stroke="var(--ink-2)" stroke-width="1.2" fill="none"><line x1="378.3" y1="126" x2="404.9" y2="126"/><line x1="378.3" y1="122" x2="378.3" y2="130"/><line x1="404.9" y1="122" x2="404.9" y2="130"/><line x1="513" y1="206" x2="538.1" y2="206"/><line x1="513" y1="202" x2="513" y2="210"/><line x1="538.1" y1="202" x2="538.1" y2="210"/></g>
  <line x1="152" y1="232" x2="562" y2="232" class="axis"/>
  <text x="152" y="247" class="lbl" text-anchor="middle">0</text>
  <text x="272.6" y="247" class="lbl" text-anchor="middle">0.2</text>
  <text x="393.2" y="247" class="lbl" text-anchor="middle">0.4</text>
  <text x="513.8" y="247" class="lbl" text-anchor="middle">0.6</text>
  <text x="357" y="262" class="lbl" text-anchor="middle">average precision, higher is better · whiskers are 95% intervals</text>
  <text x="0" y="278" class="lbl-i" text-anchor="start">✕ hatched = uses a column excluded on availability grounds</text>
</svg>
