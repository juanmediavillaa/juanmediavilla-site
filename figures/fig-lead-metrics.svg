<svg viewBox="0 0 640 210" role="img" aria-labelledby="t-fig-lead-metrics d-fig-lead-metrics" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <title id="t-fig-lead-metrics">Five definitions of detection lead</title>
  <desc id="d-fig-lead-metrics">The pre-registered metric reports a +10 minute lead. Measured against the first raw repricing the same model is 2 minutes late, and never early.</desc>
  <style>svg{--ink:#111;--muted:#52524C;--line:#E4E4DE;--accent:#0B6B52;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#F4F4F0;--muted:#ADADA5;--line:#34342F;--accent:#5FBFA0}}.lbl{font:11px var(--mono,monospace);fill:var(--muted,#555)}.lbl-i{font:11px var(--mono,monospace);fill:var(--ink,#111)}.ttl{font:12px var(--sans,sans-serif);fill:var(--ink,#111)}.axis{stroke:var(--line,#ddd);stroke-width:1}.rule{stroke:var(--ink,#111);stroke-width:1;stroke-dasharray:3 3}.bar{fill:var(--accent,#0B6B52)}.bar-2{fill:var(--muted,#555)}.ser{fill:none;stroke:var(--accent,#0B6B52);stroke-width:2}.ser-2{fill:none;stroke:var(--muted,#555);stroke-width:1.5;stroke-dasharray:5 3}.dot{fill:var(--accent,#0B6B52)}.dot-2{fill:var(--muted,#555)}.cell{fill:var(--accent,#0B6B52)}.cv{font:9.5px var(--mono,monospace);fill:var(--ink,#111)}.cv.hi{fill:#fff}</style>
  <line x1="292.0" y1="22.0" x2="292.0" y2="184.0" class="rule"/>
  <text x="292.0" y="200.0" class="lbl" text-anchor="middle">0 = simultaneous</text>
  <text x="0.0" y="42.0" class="lbl-i" text-anchor="start">pre-registered metric (n=68)</text>
  <line x1="415.0" y1="38.0" x2="428.7" y2="38.0" class="axis"/>
  <circle cx="428.7" cy="38.0" r="4.5" class="dot"><title>median 10 min, CI [9, 10], n=68, frac&gt;0 = 0.941</title></circle>
  <text x="624.0" y="42.0" class="lbl" text-anchor="end">+10 min · frac&gt;0 0.94</text>
  <text x="0.0" y="76.0" class="lbl-i" text-anchor="start">vs centred label (n=48)</text>
  <line x1="319.3" y1="72.0" x2="401.3" y2="72.0" class="axis"/>
  <circle cx="374.0" cy="72.0" r="4.5" class="dot"><title>median 6 min, CI [2, 8], n=48, frac&gt;0 = 0.812</title></circle>
  <text x="624.0" y="76.0" class="lbl" text-anchor="end">+6 min · frac&gt;0 0.81</text>
  <text x="0.0" y="110.0" class="lbl-i" text-anchor="start">vs causal detector (n=48)</text>
  <line x1="333.0" y1="106.0" x2="387.7" y2="106.0" class="axis"/>
  <circle cx="333.0" cy="106.0" r="4.5" class="dot"><title>median 3 min, CI [3, 7], n=48, frac&gt;0 = 0.833</title></circle>
  <text x="624.0" y="110.0" class="lbl" text-anchor="end">+3 min · frac&gt;0 0.83</text>
  <text x="0.0" y="144.0" class="lbl-i" text-anchor="start">episode end (n=41)</text>
  <line x1="278.3" y1="140.0" x2="415.0" y2="140.0" class="axis"/>
  <circle cx="374.0" cy="140.0" r="4.5" class="dot"><title>median 6 min, CI [-1, 9], n=41, frac&gt;0 = 0.585</title></circle>
  <text x="624.0" y="144.0" class="lbl" text-anchor="end">+6 min · frac&gt;0 0.58</text>
  <text x="0.0" y="178.0" class="lbl-i" text-anchor="start">vs first raw repricing (n=48)</text>
  <line x1="244.2" y1="174.0" x2="292.0" y2="174.0" class="axis"/>
  <circle cx="264.7" cy="174.0" r="4.5" class="dot-2"><title>median -2 min, CI [-3.5, 0], n=48, frac&gt;0 = 0</title></circle>
  <text x="624.0" y="178.0" class="lbl" text-anchor="end">-2 min · frac&gt;0 0.00</text>
</svg>
